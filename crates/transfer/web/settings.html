<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>transfer — settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/transfer/static/style.css">
</head>
<body>

<div class="tx-topbar">
  <a class="tx-brand" href="/transfer">
    <span class="tx-brand-mark">tx</span>
    transfer
  </a>
  <nav class="tx-nav">
    <a href="/transfer">Send</a>
    <a href="/transfer/download">Receive</a>
  </nav>
  <div class="tx-spacer"></div>
  <div id="tx-auth-bar"></div>
</div>

<div class="tx-main">
  <div class="tx-container tx-form-page">

    <div class="tx-display">Settings</div>

    <div class="tx-error" id="error-box" style="display:none"></div>
    <div class="tx-success" id="success-box" style="display:none"></div>

    <!-- Account info -->
    <div class="tx-card" style="padding:var(--pad-card);display:flex;flex-direction:column;gap:12px">
      <div class="tx-label" style="margin-bottom:0">Account</div>
      <div class="tx-row" style="justify-content:space-between">
        <span class="tx-meta">Email</span>
        <span id="account-email" style="font-size:13px;font-weight:500"></span>
      </div>
      <div class="tx-divider"></div>
      <div class="tx-row" style="justify-content:space-between">
        <span class="tx-meta">Password</span>
        <span id="account-pw-status" class="tx-meta"></span>
      </div>
      <div class="tx-row" style="justify-content:space-between">
        <span class="tx-meta">Google</span>
        <span id="account-google-status" class="tx-meta"></span>
      </div>
    </div>

    <!-- Add password (shown only for Google-only accounts) -->
    <div id="add-pw-section" style="display:none">
      <div class="tx-card" style="padding:var(--pad-card);display:flex;flex-direction:column;gap:var(--gap-stack)">
        <div>
          <div style="font-size:13px;font-weight:500;margin-bottom:4px">Add a password</div>
          <div class="tx-meta">Set a password to sign in without Google.</div>
        </div>
        <div>
          <label class="tx-label" for="new-password">New password <span style="color:var(--danger)">*</span></label>
          <input type="password" class="tx-input" id="new-password" placeholder="at least 8 characters" autocomplete="new-password"
                 onkeydown="if(event.key==='Enter')doAddPassword()">
        </div>
        <button class="tx-btn is-primary" id="add-pw-btn" style="width:100%;justify-content:center;height:38px" onclick="doAddPassword()">Save password</button>
      </div>
    </div>

    <div style="text-align:center">
      <a class="tx-link" href="/transfer/my" style="font-size:12px">← back to my transfers</a>
    </div>

  </div>
</div>

<script src="/transfer/static/app.js"></script>
<script>
const T = window.Transfer;
let currentUser = null;

(async function init() {
  const me = await T.checkAuth();
  if (!me) { location.href = '/transfer/login?redirect=/transfer/settings'; return; }
  currentUser = me;
  T.updateTopbar(me);

  document.getElementById('account-email').textContent = me.email;
  document.getElementById('account-pw-status').textContent = me.has_password ? 'set' : 'not set';
  document.getElementById('account-google-status').textContent = me.google_linked ? 'linked' : 'not linked';

  if (!me.has_password) {
    document.getElementById('add-pw-section').style.display = '';
  }
})();

async function doAddPassword() {
  const password = document.getElementById('new-password').value;
  if (password.length < 8) return showError('Password must be at least 8 characters.');
  const btn = document.getElementById('add-pw-btn');
  btn.disabled = true; btn.textContent = 'Saving…';
  hideError(); hideSuccess();
  try {
    await T.apiJson('/settings/add-password', { password });
    document.getElementById('account-pw-status').textContent = 'set';
    document.getElementById('add-pw-section').style.display = 'none';
    showSuccess('Password added. You can now sign in with email and password.');
  } catch (e) {
    showError(e.message || 'Failed to add password');
    btn.disabled = false; btn.textContent = 'Save password';
  }
}

function showError(msg)   { const e = document.getElementById('error-box');   e.textContent = msg; e.style.display = ''; }
function showSuccess(msg) { const e = document.getElementById('success-box'); e.textContent = msg; e.style.display = ''; }
function hideError()   { document.getElementById('error-box').style.display = 'none'; }
function hideSuccess() { document.getElementById('success-box').style.display = 'none'; }
</script>
</body>
</html>
