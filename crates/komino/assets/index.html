<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>komino</title>
  <link id="favicon" rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20x%3D%225%22%20y%3D%222%22%20width%3D%2222%22%20height%3D%2228%22%20rx%3D%224%22%20fill%3D%22%2329466b%22%2F%3E%3Cpath%20d%3D%22M16%208%20L22%2016%20L16%2024%20L10%2016%20Z%22%20fill%3D%22%233c5f8c%22%2F%3E%3C%2Fsvg%3E">
  <link rel="stylesheet" href="/komino/static/app.css">
</head>
<body>
  <header class="bar">
    <a class="brand" href="/komino">komino</a>
    <button id="guide-btn" class="small guide-btn">rules</button>
    <label class="name">
      <span>name</span>
      <input id="name" maxlength="24" autocomplete="off">
    </label>
  </header>

  <main id="lobby" hidden>
    <section class="panel">
      <h1>komino</h1>
      <p>A card game of memory and quick hands. Lowest total wins.</p>
      <div class="settings-form">
        <label>cards in hand
          <select id="set-hand">
            <option selected>4</option><option>5</option><option>6</option><option>7</option>
            <option>8</option><option>9</option><option>10</option>
          </select>
        </label>
        <label>turn limit
          <select id="set-turn">
            <option value="" selected>off</option><option value="30">30s</option>
            <option value="60">60s</option><option value="90">90s</option>
            <option value="120">2m</option><option value="300">5m</option>
          </select>
        </label>
        <label>away grace
          <select id="set-away">
            <option value="15">15s</option><option value="30" selected>30s</option>
            <option value="60">60s</option><option value="120">2m</option>
          </select>
        </label>
        <label>peek time
          <select id="set-reveal">
            <option value="">until hidden</option><option value="3">3s</option>
            <option value="5">5s</option><option value="10">10s</option>
            <option value="15" selected>15s</option><option value="30">30s</option>
          </select>
        </label>
        <label>missed matches
          <select id="set-misses">
            <option value="shown" selected>shown to all</option><option value="hidden">hidden</option>
          </select>
        </label>
        <label>play to
          <select id="set-target">
            <option value="" selected>no target</option><option value="50">50</option>
            <option value="100">100</option><option value="150">150</option><option value="200">200</option>
          </select>
        </label>
        <label>losing call penalty
          <select id="set-penalty">
            <option value="0" selected>none</option><option value="5">+5</option>
            <option value="10">+10</option><option value="20">+20</option>
          </select>
        </label>
        <label>exact target halves
          <select id="set-exact">
            <option value="off" selected>off</option><option value="on">on</option>
          </select>
        </label>
        <label>memory marks
          <select id="set-marks">
            <option value="off" selected>off</option><option value="on">allowed</option>
          </select>
        </label>
      </div>
      <button id="create" class="primary">create a room</button>
      <form id="join-form" class="join">
        <input id="join-code" placeholder="room code" maxlength="6" autocomplete="off" aria-label="room code">
        <button>join</button>
      </form>
    </section>
  </main>

  <main id="room" hidden>
    <section class="roombar">
      <div class="roomid">
        room <strong id="code"></strong>
        <span id="watch-tag" class="watch-tag">watching</span>
        <span id="observers" class="observers" hidden></span>
        <div id="settings" class="room-settings"></div>
      </div>
      <div class="actions">
        <button id="sound" class="small" aria-pressed="true">sound on</button>
        <button id="fast" class="small player-only" aria-pressed="false" title="send a match on the first tap, without confirming">fast match off</button>
        <button id="alerts" class="small player-only" aria-pressed="false" title="notify me when the game waits on me in another tab">alerts off</button>
        <button id="copy" class="small player-only">copy link</button>
        <button id="copy-watch" class="small">copy watch link</button>
        <button id="start" class="primary small" hidden>start game</button>
        <button id="leave" class="small player-only">leave</button>
        <a id="join-link" class="watch-only" href="/komino">join as player</a>
      </div>
    </section>
    <div id="status" class="status" aria-live="polite"></div>
    <div class="table-wrap">
      <section id="table" class="table"></section>
      <div id="caption" class="caption" aria-live="polite" hidden></div>
    </div>
    <section id="summary" class="panel summary" hidden></section>
    <div id="actionbar" class="actionbar" hidden>
      <div id="tip" class="tip" hidden>
        <span id="tip-text"></span>
        <span class="tip-buttons">
          <button id="tip-ok" class="small">got it</button>
          <button id="tip-off" class="small">no more tips</button>
        </span>
      </div>
      <div id="prompt" class="prompt" aria-live="polite"></div>
      <section id="controls" class="controls"></section>
    </div>
    <div id="marks" class="confirm-backdrop" hidden>
      <div class="confirm" role="dialog" aria-modal="true" aria-labelledby="marks-title">
        <p id="marks-title"></p>
        <div id="marks-values" class="mark-values"></div>
        <div class="confirm-buttons">
          <button id="marks-clear">clear mark</button>
          <button id="marks-cancel">cancel</button>
        </div>
      </div>
    </div>
    <div id="confirm" class="confirm-backdrop" hidden>
      <div class="confirm" role="dialog" aria-modal="true" aria-labelledby="confirm-text">
        <p id="confirm-text"></p>
        <div class="confirm-buttons">
          <button id="confirm-cancel">cancel</button>
          <button id="confirm-ok" class="primary">confirm</button>
        </div>
      </div>
    </div>
    <div class="columns">
      <section class="panel">
        <h2>players</h2>
        <ul id="members" class="members"></ul>
        <div id="bots" class="bots" hidden>
          <select id="bot-level" aria-label="bot level">
            <option value="easy">easy</option><option value="normal" selected>normal</option><option value="hard">hard</option>
          </select>
          <button id="add-bot" class="small">add bot</button>
        </div>
      </section>
      <section class="panel">
        <h2>log</h2>
        <ol id="log" class="log"></ol>
      </section>
    </div>
    <section class="panel">
      <h2>stats</h2>
      <div class="scroll"><table id="stats" class="stats"></table></div>
    </section>
  </main>

  <main id="gone" hidden>
    <section class="panel">
      <h1 id="gone-title"></h1>
      <p id="gone-text"></p>
      <a href="/komino">back to komino</a>
    </section>
  </main>

  <div id="guide" class="confirm-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="guide-title">
      <div class="modal-head">
        <div>
          <h2 id="guide-title">how to play</h2>
          <div id="guide-room" class="guide-room"></div>
        </div>
        <button id="guide-close" class="small">close</button>
      </div>
      <div id="guide-body" class="guide"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>
  <div id="announce" class="sr-only" aria-live="polite"></div>
  <div id="fx" class="fx-layer" aria-hidden="true"></div>
  <script src="/komino/static/app.js"></script>
</body>
</html>
